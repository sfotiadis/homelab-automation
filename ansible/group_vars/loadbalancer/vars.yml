---
# HAProxy Configuration for K8s API Server Load Balancing
haproxy_stats_port: 8404
haproxy_stats_user: admin
haproxy_stats_password: "{{ haproxy_stats_password_vault }}"

# K8s API Server backend configuration
k8s_api_port: 6443
k8s_api_backend_servers:
  - name: "{{ hostvars['k8s-cp-01']['inventory_hostname'] }}"
    ip: "{{ hostvars['k8s-cp-01']['ansible_host'] }}"
  - name: "{{ hostvars['k8s-cp-02']['inventory_hostname'] }}"
    ip: "{{ hostvars['k8s-cp-02']['ansible_host'] }}"
  - name: "{{ hostvars['k8s-cp-03']['inventory_hostname'] }}"
    ip: "{{ hostvars['k8s-cp-03']['ansible_host'] }}"
