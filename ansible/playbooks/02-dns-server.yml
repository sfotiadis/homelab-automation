---
# BIND9 DNS Server Setup Playbook
# Configures Primary-Secondary DNS architecture with dynamic updates

- name: Setup BIND9 Primary DNS Server
  hosts: dns1
  become: true
    
  tasks:
    - name: Install BIND9
      apt:
        name:
          - bind9
          - bind9utils
          - bind9-doc
        state: present
        update_cache: true

    - name: Generate TSIG key for ExternalDNS
      shell: |
        tsig-keygen -a hmac-sha256 externaldns-key > /etc/bind/externaldns.key
        chmod 640 /etc/bind/externaldns.key
        chown root:bind /etc/bind/externaldns.key
      args:
        creates: /etc/bind/externaldns.key

    - name: Configure BIND9 options
      template:
        src: ../templates/bind9/named.conf.options.j2
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: '0644'
      notify: restart bind9

    - name: Configure BIND9 local zones
      template:
        src: ../templates/bind9/named.conf.local.primary.j2
        dest: /etc/bind/named.conf.local
        owner: root
        group: bind
        mode: '0644'
      notify: restart bind9

    - name: Create zone file for crulabs.intern
      template:
        src: ../templates/bind9/zone.crulabs.intern.j2
        dest: /var/lib/bind/db.crulabs.intern
        owner: bind
        group: bind
        mode: '0644'
      notify: restart bind9

    - name: Create zone file for internal
      template:
        src: ../templates/bind9/zone.internal.j2
        dest: /var/lib/bind/db.internal
        owner: bind
        group: bind
        mode: '0644'
      notify: restart bind9

    - name: Create reverse zone file
      template:
        src: ../templates/bind9/zone.reverse.j2
        dest: /var/lib/bind/{{ reverse_zone_file }}
        owner: bind
        group: bind
        mode: '0644'
      notify: restart bind9

    - name: Start and enable BIND9
      systemd:
        name: bind9
        state: started
        enabled: true

    - name: Fetch TSIG key for secondary server
      fetch:
        src: /etc/bind/externaldns.key
        dest: /tmp/externaldns.key
        flat: true

  handlers:
    - name: restart bind9
      systemd:
        name: bind9
        state: restarted

- name: Setup BIND9 Secondary DNS Server
  hosts: dns2
  become: true

  tasks:
    - name: Install BIND9
      apt:
        name:
          - bind9
          - bind9utils
          - bind9-doc
        state: present
        update_cache: true

    - name: Copy TSIG key from primary
      copy:
        src: /tmp/externaldns.key
        dest: /etc/bind/externaldns.key
        owner: root
        group: bind
        mode: '0640'
      notify: restart bind9

    - name: Configure BIND9 options
      template:
        src: ../templates/bind9/named.conf.options.j2
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: '0644'
      notify: restart bind9

    - name: Configure BIND9 local zones (secondary)
      template:
        src: ../templates/bind9/named.conf.local.secondary.j2
        dest: /etc/bind/named.conf.local
        owner: root
        group: bind
        mode: '0644'
      notify: restart bind9

    - name: Ensure zone directory exists
      file:
        path: /var/lib/bind
        state: directory
        owner: bind
        group: bind
        mode: '0755'

    - name: Start and enable BIND9
      systemd:
        name: bind9
        state: started
        enabled: true

  handlers:
    - name: restart bind9
      systemd:
        name: bind9
        state: restarted
