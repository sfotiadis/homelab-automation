---
- name: Initialize first Kubernetes Control Plane
  hosts: k8s-cp-01
  become: true
  tasks:
    - name: Check if Kubernetes is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_initialized

    - name: Initialize Kubernetes cluster
      ansible.builtin.shell: |
        kubeadm init \
          --control-plane-endpoint="{{ k8s_control_plane_endpoint }}" \
          --upload-certs \
          --pod-network-cidr="{{ k8s_pod_network_cidr }}" \
          --service-cidr="{{ k8s_service_cidr }}" \
          --skip-phases=addon/kube-proxy
      register: kubeadm_init_output
      when: not k8s_initialized.stat.exists

    - name: Save kubeadm init output
      ansible.builtin.set_fact:
        kubeadm_init_result: "{{ kubeadm_init_output.stdout }}"
      when: not k8s_initialized.stat.exists

    - name: Display kubeadm init output for debugging
      ansible.builtin.debug:
        msg: "{{ kubeadm_init_result }}"
      when: not k8s_initialized.stat.exists

    - name: Extract token
      ansible.builtin.shell: |
        echo "{{ kubeadm_init_result }}" | grep -oP '(?<=--token )[^ ]+' | head -1
      register: join_token_raw
      when: not k8s_initialized.stat.exists

    - name: Extract discovery token CA cert hash
      ansible.builtin.shell: |
        echo "{{ kubeadm_init_result }}" | grep -oP '(?<=--discovery-token-ca-cert-hash )[^ ]+' | head -1
      register: ca_cert_hash_raw
      when: not k8s_initialized.stat.exists

    - name: Extract certificate key
      ansible.builtin.shell: |
        echo "{{ kubeadm_init_result }}" | grep -oP '(?<=--certificate-key )[^ ]+' | head -1
      register: certificate_key_raw
      when: not k8s_initialized.stat.exists

    - name: Set join facts for sharing
      ansible.builtin.set_fact:
        k8s_join_token: "{{ join_token_raw.stdout if not k8s_initialized.stat.exists else omit }}"
        k8s_ca_cert_hash: "{{ ca_cert_hash_raw.stdout if not k8s_initialized.stat.exists else omit }}"
        k8s_certificate_key: "{{ certificate_key_raw.stdout if not k8s_initialized.stat.exists else omit }}"
      when: not k8s_initialized.stat.exists

    - name: Store join info in dummy host for sharing between plays
      ansible.builtin.add_host:
        name: k8s_join_info
        k8s_join_token: "{{ k8s_join_token | default('') }}"
        k8s_ca_cert_hash: "{{ k8s_ca_cert_hash | default('') }}"
        k8s_certificate_key: "{{ k8s_certificate_key | default('') }}"
      when: not k8s_initialized.stat.exists

    - name: Create .kube directory for ubuntu user
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy kubeconfig for ubuntu user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        owner: ubuntu
        group: ubuntu
        mode: '0600'
        remote_src: true

    - name: Fetch kubeconfig to local machine
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: ~/.kube/crulabs-k8s-config
        flat: true

- name: Install and configure Cilium CNI
  hosts: localhost
  gather_facts: false
  vars:
    cilium_version: "1.18.4"
  tasks:
    - name: Check if Cilium CLI is installed
      ansible.builtin.command: which cilium
      register: cilium_cli_check
      ignore_errors: true
      changed_when: false

    - name: Get Cilium CLI latest version
      ansible.builtin.shell: |
        curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt
      register: cilium_cli_version
      when: cilium_cli_check.rc != 0
      changed_when: false

    - name: Download Cilium CLI
      ansible.builtin.get_url:
        url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version.stdout }}/cilium-linux-amd64.tar.gz"
        dest: "/tmp/cilium-linux-amd64.tar.gz"
        mode: '0644'
      when: cilium_cli_check.rc != 0

    - name: Extract Cilium CLI
      ansible.builtin.unarchive:
        src: "/tmp/cilium-linux-amd64.tar.gz"
        dest: "/tmp/"
      when: cilium_cli_check.rc != 0

    - name: Install Cilium CLI to user local bin
      ansible.builtin.copy:
        src: "/tmp/cilium"
        dest: "{{ lookup('env', 'HOME') }}/.local/bin/cilium"
        mode: '0755'
      when: cilium_cli_check.rc != 0

    - name: Ensure ~/.local/bin is in PATH
      ansible.builtin.set_fact:
        cilium_binary: "{{ lookup('env', 'HOME') }}/.local/bin/cilium"

    - name: Set KUBECONFIG environment variable
      ansible.builtin.set_fact:
        kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/crulabs-k8s-config"

    - name: Install Cilium
      ansible.builtin.shell: |
        {{ cilium_binary | default('cilium') }} install \
          --version {{ cilium_version }} \
          --set kubeProxyReplacement=true \
          --set k8sServiceHost={{ hostvars['k8s-lb-01']['ansible_host'] }} \
          --set k8sServicePort=6443
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: cilium_install

    - name: Wait for Cilium to be ready
      ansible.builtin.shell: "{{ cilium_binary | default('cilium') }} status --wait"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      retries: 10
      delay: 30
      register: cilium_status
      until: cilium_status.rc == 0

- name: Join additional Control Plane nodes
  hosts: k8s-cp-02,k8s-cp-03
  become: true
  tasks:
    - name: Check if node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: node_joined

    - name: Join control plane node to cluster
      ansible.builtin.shell: |
        kubeadm join {{ hostvars['k8s-lb-01']['ansible_host'] }}:6443 \
          --token {{ hostvars['k8s_join_info']['k8s_join_token'] }} \
          --discovery-token-ca-cert-hash {{ hostvars['k8s_join_info']['k8s_ca_cert_hash'] }} \
          --control-plane \
          --certificate-key {{ hostvars['k8s_join_info']['k8s_certificate_key'] }}
      when: not node_joined.stat.exists

    - name: Create .kube directory for ubuntu user
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      when: not node_joined.stat.exists

    - name: Copy kubeconfig for ubuntu user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        owner: ubuntu
        group: ubuntu
        mode: '0600'
        remote_src: true
      when: not node_joined.stat.exists

- name: Join Worker nodes
  hosts: k8s_workers
  become: true
  tasks:
    - name: Check if node is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: node_joined

    - name: Join worker node to cluster
      ansible.builtin.shell: |
        kubeadm join {{ hostvars['k8s-lb-01']['ansible_host'] }}:6443 \
          --token {{ hostvars['k8s_join_info']['k8s_join_token'] }} \
          --discovery-token-ca-cert-hash {{ hostvars['k8s_join_info']['k8s_ca_cert_hash'] }}
      when: not node_joined.stat.exists
